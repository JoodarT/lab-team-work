databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: Bolot Azatov
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-create-roles-table
      author: Bolot Azatov
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 3-create-user-roles-table
      author: Bolot Azatov
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_roles_user
                    referencedTableName: users
                    referencedColumnName: id
                    deleteCascade: true
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_roles_role
                    referencedTableName: roles
                    referencedColumnName: id
                    deleteCascade: true
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles

  - changeSet:
      id: 4-create-quizzes-table
      author: Bolot Azatov
      changes:
        - createTable:
            tableName: quizzes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: category
                  type: VARCHAR(100)
              - column:
                  name: time_limit_seconds
                  type: INT
              - column:
                  name: creator_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_quizzes_creator
                    referencedTableName: users
                    referencedColumnName: id

  - changeSet:
      id: 5-create-questions-table
      author: Bolot Azatov
      changes:
        - createTable:
            tableName: questions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: quiz_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_questions_quiz
                    referencedTableName: quizzes
                    referencedColumnName: id
                    deleteCascade: true
              - column:
                  name: question_text
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false

  - changeSet:
      id: 6-create-options-table
      author: Bolot Azatov
      changes:
        - createTable:
            tableName: options
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: question_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_options_question
                    referencedTableName: questions
                    referencedColumnName: id
                    deleteCascade: true
              - column:
                  name: option_text
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: is_correct
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 7-create-quiz-results-table
      author: Bolot Azatov
      changes:
        - createTable:
            tableName: quiz_results
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_results_user
                    referencedTableName: users
                    referencedColumnName: id
              - column:
                  name: quiz_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_results_quiz
                    referencedTableName: quizzes
                    referencedColumnName: id
              - column:
                  name: score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 8-create-quiz-ratings-table
      author: Bolot Azatov
      changes:
        - createTable:
            tableName: quiz_ratings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ratings_user
                    referencedTableName: users
                    referencedColumnName: id
              - column:
                  name: quiz_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ratings_quiz
                    referencedTableName: quizzes
                    referencedColumnName: id
              - column:
                  name: rating
                  type: INT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: quiz_ratings
            columnNames: user_id, quiz_id
            constraintName: uk_user_quiz_rating